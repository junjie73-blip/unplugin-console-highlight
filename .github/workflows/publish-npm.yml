name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9 # 请改为你本地使用的 pnpm 版本

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the package
        # 在 monorepo 中，精准构建你要发布的包
        run: pnpm --filter unplugin-console-highlight build

      - name: Publish to npm
        # 使用 --filter 精准发布，不要 cd 进目录，避免 workspace 依赖解析出错
        run: pnpm --filter unplugin-console-highlight publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}